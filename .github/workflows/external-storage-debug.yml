name: Build full UI redesign debug APK

on:
  push:
    branches:
      - feature/external-storage
      - feature/background-game
      - feature/ui-full-redesign
  workflow_dispatch:

permissions:
  contents: read

# One build for the latest commit; older commits on this branch don't
# need to consume runner resources.
concurrency:
  group: external-storage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install required Android packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local-only signing settings
        run: |
          printf 'keyAlias=androiddebugkey\nkeyPassword=android\nstoreFile=keystore.jks\nstorePassword=android\n' > keystore.properties
          keytool -genkeypair -noprompt -keystore app/keystore.jks -alias androiddebugkey -storepass android -keypass android -dname "CN=J2ME Debug" -keyalg RSA -keysize 2048 -validity 3650

      - name: Build dev debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDevDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Full-UI-debug
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error

      # The earlier experimental Glass UI compiled but crashed on launch.
      # Smoke-test the actual launcher activity in dark and light mode, while
      # keeping this costly emulator step scoped to the UI redesign branch.
      - name: Enable Android emulator KVM
        if: github.ref == 'refs/heads/feature/ui-full-redesign'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke-test launcher on Android 15 (API 35)
        if: github.ref == 'refs/heads/feature/ui-full-redesign'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/ui-smoke.sh

      - name: Upload UI preview screenshots
        if: always() && github.ref == 'refs/heads/feature/ui-full-redesign'
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-UI-Light-Dark-Previews
          path: ui-smoke/*.png
          if-no-files-found: warn
