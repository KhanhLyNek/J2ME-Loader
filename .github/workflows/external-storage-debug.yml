name: Build external-storage debug APK

on:
  push:
    branches:
      - feature/external-storage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local-only signing settings
        run: |
          printf 'keyAlias=androiddebugkey\nkeyPassword=android\nstoreFile=keystore.jks\nstorePassword=android\n' > keystore.properties
          keytool -genkeypair -noprompt -keystore app/keystore.jks -alias androiddebugkey -storepass android -keypass android -dname "CN=J2ME Debug" -keyalg RSA -keysize 2048 -validity 3650

      - name: Build dev debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDevDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-External-Storage-debug
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
